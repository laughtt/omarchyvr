[package]
name = "pimax-device"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headset modules (TOML descriptors + a small trait), the HID command allowlist enforced at the send layer, system Check/Fix types and the onboarding progress file. No device I/O of its own."

[lib]
name = "pimax_device"
path = "src/lib.rs"

[dependencies]
# Host abstraction and the existing checks (wrapped, not moved yet; see docs/ARCHITECTURE.md "Migration").
omarchyvr-doctor = { path = "../omarchyvr-doctor" }

[dev-dependencies]
pimax-proto = { workspace = true, features = ["std"] }
# the auto-exposure tables and controller, checked against each headset's camera_ae allowlist (tests/allowlist.rs)
pimax-cam = { path = "../pimax-cam" }
